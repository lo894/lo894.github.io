<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>龙欣悦 · 个人简历海报 | 自然生长</title>
<meta name="description" content="龙欣悦 · 自然生长 · 扫码 / 点击直达个人简历网站。">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --green-d:#2f4a26;--green-m:#6b8a52;--green-l:#eef3e3;--green-b:#dce8c8;
    --white:#ffffff;
  }
  html,body{min-height:100%;}
  body{
    background:linear-gradient(165deg,#eef3e3 0%,#dce8c8 100%);
    font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:1.4rem;color:var(--green-d);
    -webkit-font-smoothing:antialiased;
  }

  .poster{
    position:relative;width:100%;max-width:440px;aspect-ratio:1080/1528;
    background:linear-gradient(180deg,#eef3e3 0%,#dce8c8 100%);
    border-radius:30px;overflow:hidden;
    box-shadow:0 30px 70px rgba(47,74,38,0.20);
    display:flex;flex-direction:column;align-items:center;
    padding:7% 7% 5%;
  }
  /* 柔光圆 */
  .glow{position:absolute;border-radius:50%;filter:blur(40px);z-index:0;pointer-events:none;}
  .glow.g1{width:54%;height:0;padding-bottom:54%;background:rgba(255,255,255,0.55);top:-12%;left:-16%;}
  .glow.g2{width:42%;height:0;padding-bottom:42%;background:rgba(107,138,82,0.32);top:24%;right:-12%;}
  .glow.g3{width:50%;height:0;padding-bottom:50%;background:rgba(255,255,255,0.45);bottom:8%;left:-18%;}
  /* 远山剪影 */
  .mountains{position:absolute;left:0;right:0;bottom:0;width:100%;height:24%;z-index:0;pointer-events:none;}

  .content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;}

  .avatar-ring{
    width:33%;max-width:150px;aspect-ratio:1;padding:4px;background:var(--white);
    border-radius:50%;box-shadow:0 10px 26px rgba(47,74,38,0.18);
    margin-top:2%;
  }
  .avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}

  .name{font-size:clamp(2rem,9vw,2.8rem);font-weight:700;letter-spacing:6px;margin-top:5%;}
  .motto{font-size:clamp(1rem,4.4vw,1.25rem);color:var(--green-m);letter-spacing:5px;margin-top:1.5%;font-style:italic;}
  .divider{width:30%;height:3px;border-radius:3px;background:var(--green-m);opacity:0.5;margin:5% 0 6%;}

  .qr-card{background:var(--white);border-radius:26px;padding:6% 6% 5%;box-shadow:0 14px 34px rgba(47,74,38,0.14);}
  .qr-card img{width:58vw;max-width:230px;aspect-ratio:1;border-radius:14px;display:block;}
  .qr-hint{margin-top:5%;font-size:clamp(0.95rem,4.2vw,1.1rem);font-weight:600;}

  /* 进入个人简历主按钮 */
  .enter-btn{
    display:block;text-decoration:none;color:#fff;text-align:center;
    background:linear-gradient(135deg,#3c6e2f,#5d7a44);
    border-radius:16px;padding:4.5% 5%;margin-top:7%;width:100%;
    font-size:clamp(1.05rem,4.8vw,1.25rem);font-weight:700;letter-spacing:1px;
    box-shadow:0 12px 26px rgba(60,110,47,0.40);
    transition:transform .25s ease,filter .25s ease;
  }
  .enter-btn:hover{transform:translateY(-3px);filter:brightness(1.07);}

  .links{margin-top:6%;width:100%;display:flex;flex-direction:column;gap:3.4%;}
  .link{
    display:block;text-decoration:none;color:var(--white);text-align:left;
    background:linear-gradient(135deg,var(--green-m),#5d7a44);
    border-radius:16px;padding:4% 5%;box-shadow:0 10px 22px rgba(107,138,82,0.32);
    transition:transform .25s ease,filter .25s ease;
  }
  .link:hover{transform:translateY(-3px);filter:brightness(1.06);}
  .link .tag{display:block;font-size:clamp(0.95rem,4.2vw,1.1rem);font-weight:700;margin-bottom:1.5%;}
  .link .url{display:block;font-size:clamp(0.7rem,3.1vw,0.82rem);opacity:0.92;word-break:break-all;line-height:1.35;}
  .link .deploy{display:block;margin-top:2.5%;font-size:clamp(0.66rem,3vw,0.78rem);opacity:0.85;line-height:1.4;
    border-top:1px solid rgba(255,255,255,0.25);padding-top:2.5%;}

  .footer{margin-top:auto;padding-top:6%;font-size:clamp(0.72rem,3.1vw,0.82rem);color:var(--green-m);opacity:0.75;letter-spacing:1px;line-height:1.5;}

  @media(max-width:380px){
    .poster{border-radius:22px;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="poster">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <svg class="mountains" viewBox="0 0 1080 360" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,360 0,250 302,150 540,260 778,140 1080,250 1080,360" fill="rgba(107,138,82,0.38)"></polygon>
      <polygon points="0,360 0,300 378,210 648,300 918,220 1080,310 1080,360" fill="rgba(47,74,38,0.42)"></polygon>
    </svg>

    <div class="content">
      <div class="avatar-ring">
        <img src="avatar.jpg" alt="龙欣悦">
      </div>
      <div class="name">龙欣悦</div>
      <div class="motto">自然生长</div>
      <div class="divider"></div>

      <div class="qr-card">
        <img src="site-qr.png" alt="简历网站二维码">
        <div class="qr-hint">扫码访问我的个人简历</div>
      </div>

      <a class="enter-btn" href="https://0078e1391e514029ab9dd908e19e88b5.gz4.agentos-app.net" target="_blank" rel="noopener">
        🚀 进入我的个人简历
      </a>

      <div class="links">
        <a class="link" href="https://0078e1391e514029ab9dd908e19e88b5.gz4.agentos-app.net" target="_blank" rel="noopener">
          <span class="tag">🌐 外网主页（国内主站）</span>
          <span class="url">https://0078e1391e514029ab9dd908e19e88b5.gz4.agentos-app.net</span>
          <span class="deploy">部署方式：CloudStudio 沙箱（由 WorkBuddy 发布）</span>
        </a>
        <a class="link" href="https://lo894.github.io/" target="_blank" rel="noopener">
          <span class="tag">📦 备份站点（海外）</span>
          <span class="url">https://lo894.github.io/</span>
          <span class="deploy">部署方式：GitHub Pages</span>
        </a>
      </div>

      <div class="footer">© 2026 龙欣悦 · 自然生长 · 由 Vibe Coding 自主打造</div>
    </div>
  </div>
</body>
</html>
