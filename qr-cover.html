<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>龙欣悦 · 扫码访问简历 | 自然生长</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <meta name="description" content="龙欣悦 · 自然生长 · 扫码访问个人简历。08女大，热爱AI与创作。">
  <meta name="theme-color" content="#7a9f5a">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#f8faf5;--surface:rgba(255,255,250,0.65);--text:#2e3c28;--text-secondary:#5b734b;
      --primary:#7a9f5a;--primary-light:#d4e3c5;--border:rgba(150,180,120,0.22);
      --accent:#e6b422;
    }
    html,body{height:100%;}
    body{
      background-color:var(--bg);
      background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop');
      background-size:cover;background-position:center;background-attachment:fixed;
      font-family:'Quicksand','PingFang SC','Microsoft YaHei',sans-serif;
      color:var(--text);line-height:1.7;overflow-x:hidden;
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:2rem 1rem;position:relative;
    }
    body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(248,252,242,0.85);backdrop-filter:blur(14px);z-index:-1;}

    @keyframes softBreath{0%{box-shadow:0 0 30px rgba(122,159,90,0.2),0 0 60px rgba(122,159,90,0.1);}50%{box-shadow:0 0 50px rgba(122,159,90,0.4),0 0 90px rgba(122,159,90,0.2);}100%{box-shadow:0 0 30px rgba(122,159,90,0.2),0 0 60px rgba(122,159,90,0.1);}}
    @keyframes floatGentle{0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}}
    @keyframes leafSway{0%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}100%{transform:rotate(-3deg);}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(25px);}to{opacity:1;transform:translateY(0);}}
    @keyframes qrPop{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}

    .cover-card{
      background:var(--surface);backdrop-filter:blur(20px);
      border:1px solid var(--border);border-radius:2.5rem;
      padding:3.2rem 3rem 2.6rem;max-width:480px;width:100%;
      box-shadow:0 25px 55px rgba(70,90,50,0.12);
      text-align:center;animation:fadeInUp 1s ease forwards;
      position:relative;
    }

    .leaf-deco{font-size:2.2rem;margin-bottom:0.6rem;display:inline-block;animation:leafSway 4s infinite ease-in-out;opacity:0.9;}

    .avatar-wrap{
      width:140px;height:140px;border-radius:50%;margin:0 auto 1.2rem;
      padding:5px;background:linear-gradient(135deg,var(--primary-light),#fff,var(--primary-light));
      animation:softBreath 5s infinite ease-in-out, floatGentle 4s infinite ease-in-out;
      position:relative;
    }
    .avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid rgba(255,255,255,0.7);}

    .cover-name{
      font-family:'Cormorant Garamond','Noto Serif SC',serif;
      font-size:3.6rem;font-weight:500;color:var(--text);
      letter-spacing:6px;line-height:1.1;margin-bottom:0.2rem;
    }
    .cover-motto{
      font-family:'Cormorant Garamond','Noto Serif SC',serif;
      font-size:1.35rem;font-style:italic;color:var(--primary);
      margin-bottom:1rem;letter-spacing:2px;
    }
    .divider{
      width:60px;height:2px;margin:0 auto 1.4rem;
      background:linear-gradient(90deg,transparent,var(--primary),transparent);
      border:none;
    }

    .qr-section{
      background:rgba(245,250,235,0.6);border:1px solid var(--border);
      border-radius:1.8rem;padding:1.6rem 1.5rem 1.3rem;margin:0 auto 1.4rem;max-width:300px;
      animation:qrPop 1s ease 0.2s both;
    }
    .qr-label{font-size:0.82rem;color:var(--text-secondary);margin-bottom:0.9rem;font-weight:500;letter-spacing:1px;}
    .qr-img{
      width:200px;height:200px;border-radius:1rem;object-fit:cover;
      border:2px solid rgba(160,190,120,0.35);
      box-shadow:0 8px 20px rgba(70,90,40,0.15);
    }
    .qr-hint{font-size:0.75rem;color:var(--text-secondary);margin-top:0.7rem;opacity:0.8;}

    .cover-url{
      font-size:0.74rem;color:var(--text-secondary);word-break:break-all;
      margin-bottom:1.6rem;line-height:1.5;opacity:0.85;
    }

    .enter-btn{
      display:inline-flex;align-items:center;gap:0.5rem;
      background:rgba(210,230,190,0.75);backdrop-filter:blur(12px);
      border:1px solid var(--primary);
      padding:0.85rem 2.8rem;border-radius:3rem;
      font-size:1.05rem;font-weight:600;color:#1e3514;
      cursor:pointer;transition:all 0.4s;text-decoration:none;
      box-shadow:0 10px 25px rgba(90,120,60,0.2);letter-spacing:2px;
      font-family:'Quicksand',sans-serif;
    }
    .enter-btn:hover{background:#c8e0b0;transform:translateY(-3px);box-shadow:0 14px 30px rgba(90,120,60,0.3);}
    .enter-btn .arrow{transition:transform 0.3s;}
    .enter-btn:hover .arrow{transform:translateX(4px);}

    .cover-footer{margin-top:1.8rem;font-size:0.74rem;color:var(--text-secondary);opacity:0.6;letter-spacing:1px;}

    @media(max-width:480px){
      .cover-card{padding:2.6rem 1.5rem 2.2rem;border-radius:2rem;}
      .cover-name{font-size:3rem;letter-spacing:4px;}
      .avatar-wrap{width:120px;height:120px;}
      .qr-img{width:180px;height:180px;}
    }
    @media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;}}
  </style>
</head>
<body>
  <div class="cover-card">
    <div class="leaf-deco">🌿</div>

    <div class="avatar-wrap">
      <img src="avatar.jpg" alt="龙欣悦" draggable="false">
    </div>

    <h1 class="cover-name">龙欣悦</h1>
    <p class="cover-motto">自然生长</p>
    <div class="divider"></div>

    <div class="qr-section">
      <p class="qr-label">扫码访问我的个人简历</p>
      <img src="site-qr.png" class="qr-img" alt="简历网站二维码" draggable="false">
      <p class="qr-hint">手机扫一扫 · 或点击下方按钮进入</p>
    </div>

    <p class="cover-url">https://0078e1391e514029ab9dd908e19e88b5.gz4.agentos-app.net</p>

    <a href="index.html" class="enter-btn">
      进入简历 <span class="arrow">→</span>
    </a>

    <p class="cover-footer">© 2026 龙欣悦 · 自然生长 · 由 Vibe Coding 自主打造</p>
  </div>
</body>
</html>
